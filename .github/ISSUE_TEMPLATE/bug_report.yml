name: Bug report
description: Something behaves differently from what it says it does
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. One thing worth knowing before you start: this project treats **an
        interface that states something untrue** as a bug of the same class as a crash. If a page
        shows a number it cannot justify, or says "none" where it means "not recorded", that is a
        report worth making.

        If your finding is a **security issue**, please do not file it here — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The steps you took. If it involves data, say what the record looked like — several defects
        in this project's history only appeared for a specific shape of row (an empty theme array,
        a place with no coordinates, a review by a deleted user).
      placeholder: |
        1. Sign in as a normal user
        2. Open /places/1
        3. …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Frontend (Next.js)
        - API (Express)
        - Database / migrations
        - Auth (Firebase)
        - Admin panel
        - Tests or CI
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit
      description: 'Output of `git rev-parse --short HEAD`, if you are running it locally.'

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS for a frontend issue; Node and PostgreSQL versions for a backend one.

  - type: textarea
    id: logs
    attributes:
      label: Console or server output
      description: Paste it as-is. **Redact any token or connection string before posting.**
      render: shell
